name: 问题反馈
description: 帮助复现具体问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请遮盖 API Key 和私人聊天，不要上传设备数据库。"
  - type: input
    id: version
    attributes:
      label: App版本与安装来源
      placeholder: "0.16.3 Lite / GitHub Release"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机型号与Android版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: "写出操作步骤、实际结果和期望结果。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的截图或日志
